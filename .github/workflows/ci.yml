name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `.env` is not committed, and without an API url every page's fetches hang the prerender.
      # Repository variables override the public production values from `.env.example`.
      - name: Run checks
        run: npm run check
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api-production-1765.up.railway.app' }}
          SHOP_ID: ${{ vars.SHOP_ID || '4c5a2b96-02da-4c15-b87a-b81ec8708437' }}
